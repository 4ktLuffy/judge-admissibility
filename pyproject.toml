[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-evals-admissibility"
version = "0.2.0"
description = "Certify a pydantic-evals judge with controls, and gate changes on its verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic-evals>=2.52,<3"]

[project.scripts]
judge-admissibility = "pydantic_evals_admissibility._cli:main_exit"

[project.entry-points.pytest11]
# Named after the module, so `-p pydantic_evals_admissibility.pytest_plugin` does not load it twice.
"pydantic_evals_admissibility.pytest_plugin" = "pydantic_evals_admissibility.pytest_plugin"

[project.optional-dependencies]
# Only `promote`, `start_canary` and `finish_canary` need Logfire's managed variables.
logfire = ["logfire[variables]>=5.1"]

[tool.hatch.build.targets.wheel]
packages = ["pydantic_evals_admissibility"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
